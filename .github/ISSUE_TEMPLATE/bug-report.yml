# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: "\U0001F41E Bug report"
description: Create a bug report
labels:
  - "bug"
  - "triage"

body:
  - type: markdown
    attributes:
      value: |
        **Thank :heart: you for taking the time to fill out this bug report!**

        We kindly ask that you search to see if an issue [already exists](https://github.com/kernelkit/dhcprelayd/issues?q=is%3Aissue+sort%3Acreated-desc+) for the bug you encountered.

  - type: input
    attributes:
      label: Version
      description: Output from `dhcprelayd -v`, or the git commit you built from.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Current Behavior
      description: |
        A clear and concise description of the issue you're experiencing.
      value: |
        For logs, commands, etc., please use triple backticks:
        ```
        $ dhcprelayd -d -f /etc/dhcprelayd.conf
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: |
        A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: |
        Steps to reproduce the issue, including the network setup: routed
        interface or bridge, VLANs, where the clients and servers are.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional information
      description: |
        - Your configuration file
        - Debug log, from `dhcprelayd -d`
        - A packet capture from the client and server side, if possible
        - DHCP server and client used, and their versions

        **Tip:** You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
