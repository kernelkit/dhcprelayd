name: Bob the Builder

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
      fail-fast: false
    env:
      MAKEFLAGS: -j3
      CC: ${{ matrix.compiler }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkg-config libnl-3-dev libnl-route-3-dev \
               libnl-genl-3-dev libjansson-dev libev-dev \
               dnsmasq-base busybox nftables tcpdump
      - uses: actions/checkout@v6
      - name: Configure
        run: |
          ./autogen.sh
          ./configure
      - name: Build
        run: |
          make
          ./src/dhcprelayd -v
          ./src/dhcprelayd -h
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        run: |
          make check || (cat tests/test-suite.log; false)
      - name: Check distribution
        run: |
          make distcheck
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dhcprelayd-test-${{ matrix.compiler }}
          path: tests/*.log
