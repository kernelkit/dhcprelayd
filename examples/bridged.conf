# IP address per port on a VLAN filtering bridge, with option 82.

# Servers for interfaces that have no server of their own
server 192.168.2.1 {
    port = 1067
}
server 192.168.3.1 {}

option82 {
    policy    = replace         # replace, keep, or drop
    remote-id = switch10        # default: the hostname
}

# Requests from bridge ports eth0 and eth6 in VLAN 1
interface vlan1 {
    giaddr = 192.168.1.6        # default: auto, first address of vlan1

    server 192.168.100.2 {}

    port eth0 {}                # circuit-id is the port name, "eth0"
    port eth6 {
        circuit-id = cabinet-3
    }
}

# Requests from bridge ports eth3 and eth8 in VLAN 2, and trunk port eth9
interface vlan2 {
    port eth3 {
        circuit-id-hex = 00:03
    }
    port eth8 {}
    port eth9 {
        tagged = true           # only requests tagged with VLAN 2
    }
}
