<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>DHCP relay with option 82, IP address per port</title>
  <style>
    .fg     { fill: #1f2328; }
    .muted  { fill: #59636e; }
    .mono   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .box    { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .port   { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .bcast  { stroke: #0969da; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .ucast  { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .blue   { fill: #0969da; }
    .green  { fill: #1a7f37; }
    .orange { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .fg     { fill: #e6edf3; }
      .muted  { fill: #9198a1; }
      .box    { fill: #151b23; stroke: #3d444d; }
      .port   { fill: #0d1117; stroke: #9198a1; }
      .bcast  { stroke: #4493f8; }
      .ucast  { stroke: #3fb950; }
      .blue   { fill: #4493f8; }
      .green  { fill: #3fb950; }
      .orange { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="green"/>
    </marker>
  </defs>

  <!-- Clients -->
  <g>
    <rect class="box" x="20" y="50" width="150" height="50" rx="6"/>
    <text class="fg" x="95" y="72" text-anchor="middle" font-weight="600">Camera</text>
    <text class="muted" x="95" y="90" text-anchor="middle" font-size="12">no IP configured</text>

    <rect class="box" x="20" y="130" width="150" height="50" rx="6"/>
    <text class="fg" x="95" y="152" text-anchor="middle" font-weight="600">PLC</text>
    <text class="muted" x="95" y="170" text-anchor="middle" font-size="12">no IP configured</text>

    <rect class="box" x="20" y="210" width="150" height="50" rx="6"/>
    <text class="fg" x="95" y="232" text-anchor="middle" font-weight="600">Operator panel</text>
    <text class="muted" x="95" y="250" text-anchor="middle" font-size="12">no IP configured</text>
  </g>

  <!-- Broadcasts on the client side -->
  <line class="bcast" x1="170" y1="75"  x2="285" y2="75"/>
  <line class="bcast" x1="170" y1="155" x2="285" y2="155"/>
  <line class="bcast" x1="170" y1="235" x2="285" y2="235"/>
  <text class="blue" x="228" y="66" text-anchor="middle" font-size="12">broadcast</text>

  <!-- Switch / relay agent -->
  <rect class="box" x="285" y="30" width="230" height="250" rx="8"/>
  <text class="fg" x="390" y="130" text-anchor="middle" font-weight="600">Switch</text>
  <text class="muted" x="390" y="150" text-anchor="middle" font-size="12">DHCP relay agent</text>
  <text class="mono muted" x="390" y="180" text-anchor="middle">giaddr 10.0.0.1</text>
  <text class="mono muted" x="390" y="198" text-anchor="middle">remote-id switch1</text>
  <rect class="port" x="295" y="63" width="36" height="24" rx="3"/>
  <text class="mono fg" x="313" y="79" text-anchor="middle">e1</text>
  <rect class="port" x="295" y="143" width="36" height="24" rx="3"/>
  <text class="mono fg" x="313" y="159" text-anchor="middle">e2</text>
  <rect class="port" x="295" y="223" width="36" height="24" rx="3"/>
  <text class="mono fg" x="313" y="239" text-anchor="middle">e3</text>
  <rect class="port" x="469" y="143" width="36" height="24" rx="3"/>
  <text class="mono fg" x="487" y="159" text-anchor="middle">e9</text>

  <!-- Unicast to the server -->
  <line class="ucast" x1="515" y1="155" x2="600" y2="155" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text class="green" x="557" y="140" text-anchor="middle" font-size="12">unicast</text>
  <text class="orange" x="557" y="176" text-anchor="middle" font-size="12">+ option 82</text>

  <!-- DHCP server -->
  <rect class="box" x="600" y="70" width="180" height="170" rx="6"/>
  <text class="fg" x="690" y="95" text-anchor="middle" font-weight="600">DHCP server</text>
  <text class="mono muted" x="690" y="113" text-anchor="middle">20.0.0.2</text>
  <text class="muted" x="616" y="145" font-size="12">circuit-id → address</text>
  <text class="mono fg" x="616" y="168">e1 → 10.0.0.41</text>
  <text class="mono fg" x="616" y="188">e2 → 10.0.0.42</text>
  <text class="mono fg" x="616" y="208">e3 → 10.0.0.43</text>

  <!-- Networks -->
  <text class="muted" x="152" y="305" text-anchor="middle" font-size="12">Client network 10.0.0.0/24</text>
  <text class="muted" x="690" y="305" text-anchor="middle" font-size="12">Server network 20.0.0.0/24</text>
</svg>
