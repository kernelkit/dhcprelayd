<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>How dhcprelayd relays a request and its reply</title>
  <style>
    .fg     { fill: #1f2328; }
    .muted  { fill: #59636e; }
    .mono   { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .box    { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .inner  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .port   { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
    .wire   { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .req    { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .rep    { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .block  { stroke: #cf222e; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .blue   { fill: #0969da; }
    .green  { fill: #1a7f37; }
    .red    { fill: #cf222e; }
    .num    { fill: #1f2328; }
    .numtxt { fill: #ffffff; font-size: 12px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .fg     { fill: #e6edf3; }
      .muted  { fill: #9198a1; }
      .box    { fill: #151b23; stroke: #3d444d; }
      .inner  { fill: #0d1117; stroke: #3d444d; }
      .port   { fill: #0d1117; stroke: #9198a1; }
      .wire   { stroke: #656c76; }
      .req    { stroke: #4493f8; }
      .rep    { stroke: #3fb950; }
      .block  { stroke: #f85149; }
      .blue   { fill: #4493f8; }
      .green  { fill: #3fb950; }
      .red    { fill: #f85149; }
      .num    { fill: #e6edf3; }
      .numtxt { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="blue"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="green"/>
    </marker>
  </defs>

  <!-- Switch -->
  <rect class="box" x="40" y="20" width="560" height="300" rx="8"/>
  <text class="fg" x="58" y="44" font-weight="600">Switch</text>

  <!-- dhcprelayd -->
  <rect class="inner" x="200" y="60" width="240" height="70" rx="6"/>
  <text class="fg" x="320" y="90" text-anchor="middle" font-weight="600">dhcprelayd</text>
  <text class="mono muted" x="320" y="110" text-anchor="middle">giaddr 10.0.0.1</text>

  <!-- Bridge -->
  <rect class="inner" x="80" y="220" width="360" height="60" rx="6"/>
  <text class="fg" x="428" y="243" text-anchor="end" font-weight="600">br0</text>
  <text class="mono muted" x="428" y="262" text-anchor="end">FDB: client MAC → e1</text>
  <rect class="port" x="105" y="270" width="40" height="22" rx="3"/>
  <text class="mono fg" x="125" y="285" text-anchor="middle">e1</text>
  <rect class="port" x="205" y="270" width="40" height="22" rx="3"/>
  <text class="mono fg" x="225" y="285" text-anchor="middle">e2</text>

  <!-- Not flooded -->
  <line class="block" x1="150" y1="250" x2="200" y2="250"/>
  <text class="red" x="175" y="256" text-anchor="middle" font-size="16" font-weight="700">✕</text>
  <text class="red" x="175" y="240" text-anchor="middle" font-size="11">not flooded</text>

  <!-- Uplink port -->
  <rect class="port" x="580" y="80" width="40" height="40" rx="3"/>
  <text class="mono fg" x="600" y="105" text-anchor="middle">e9</text>

  <!-- Clients -->
  <rect class="box" x="70" y="360" width="110" height="50" rx="6"/>
  <text class="fg" x="125" y="382" text-anchor="middle" font-weight="600">Client</text>
  <text class="mono muted" x="125" y="399" text-anchor="middle">on e1</text>
  <rect class="box" x="190" y="360" width="110" height="50" rx="6"/>
  <text class="fg" x="245" y="382" text-anchor="middle" font-weight="600">Client</text>
  <text class="mono muted" x="245" y="399" text-anchor="middle">on e2</text>
  <path class="wire" d="M225,292 V330 H245 V360"/>

  <!-- DHCP server -->
  <rect class="box" x="660" y="60" width="140" height="80" rx="6"/>
  <text class="fg" x="730" y="92" text-anchor="middle" font-weight="600">DHCP server</text>
  <text class="mono muted" x="730" y="112" text-anchor="middle">20.0.0.2</text>

  <!-- 1-2: request from client, trapped to dhcprelayd -->
  <path class="req" d="M115,360 V170 H240 V134" marker-end="url(#ab)"/>
  <!-- 3-4: relayed to server -->
  <path class="rep" d="M440,90 H656" marker-end="url(#ag)"/>
  <!-- 5: reply from server -->
  <path class="rep" d="M660,112 H444" marker-end="url(#ag)"/>
  <!-- 6: reply to client -->
  <path class="rep" d="M290,130 V190 H135 V356" marker-end="url(#ag)"/>

  <!-- Step numbers -->
  <g>
    <circle class="num" cx="96" cy="330" r="11"/><text class="numtxt" x="96" y="334" text-anchor="middle">1</text>
    <circle class="num" cx="96" cy="200" r="11"/><text class="numtxt" x="96" y="204" text-anchor="middle">2</text>
    <circle class="num" cx="320" cy="44" r="11"/><text class="numtxt" x="320" y="48" text-anchor="middle">3</text>
    <circle class="num" cx="520" cy="72" r="11"/><text class="numtxt" x="520" y="76" text-anchor="middle">4</text>
    <circle class="num" cx="520" cy="132" r="11"/><text class="numtxt" x="520" y="136" text-anchor="middle">5</text>
    <circle class="num" cx="310" cy="165" r="11"/><text class="numtxt" x="310" y="169" text-anchor="middle">6</text>
  </g>

  <!-- Legend -->
  <line class="req" x1="400" y1="380" x2="440" y2="380"/>
  <text class="fg" x="450" y="385" font-size="13">request, broadcast from the client</text>
  <line class="rep" x1="400" y1="405" x2="440" y2="405"/>
  <text class="fg" x="450" y="410" font-size="13">relayed, unicast to and from the server</text>
</svg>
